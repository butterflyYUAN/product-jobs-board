name: Crawl Product Jobs (every 6h)

on:
  schedule:
    # Every 6 hours (UTC). GitHub may delay a few minutes.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}        # allow manual runs from the Actions tab

# Grant the workflow permission to commit data and publish Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent deploys.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install headless Chromium for the Playwright-based crawlers
          # (ByteDance / Taotian / Ele.me). --with-deps installs OS libs.
          playwright install --with-deps chromium

      - name: Crawl + build site
        run: python run_all.py

      # Deploy happens BEFORE the optional data commit, so a commit failure
      # (e.g. a concurrent run pushed first) can never block the site update.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Best-effort: keep jobs_data.json history. Never fails the run.
      - name: Commit updated data (best-effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git pull --rebase --autostash origin main || true
            git commit -m "chore: scheduled crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || echo "push skipped (concurrent run already pushed)"
          fi
